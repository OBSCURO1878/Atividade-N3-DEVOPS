apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: n3-angelo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-loja
  template:
    metadata:
      labels:
        app: api-loja
    spec:
      containers:
        - name: api
          image: api-loja:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: db-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: n3-angelo
spec:
  type: NodePort
  selector:
    app: api-loja
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
